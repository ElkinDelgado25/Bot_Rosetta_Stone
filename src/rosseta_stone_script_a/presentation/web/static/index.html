<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosseta Stone Bot</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --border: #e2e5ea; --text: #1b1f24;
    --muted: #6b7280; --accent: #2f6fd0; --ok: #1a7f47; --err: #c0392b;
    --warn: #b7791f; --console-bg: #12151a; --console-fg: #d6dde7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --border: #262c35; --text: #e6eaf0;
      --muted: #9aa4b2; --accent: #5b9cf5; --ok: #4ade80; --err: #f87171;
      --warn: #fbbf24; --console-bg: #0a0d11; --console-fg: #cbd5e1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header h1 .by { font-weight: 400; font-size: 12px; color: var(--muted);
                  margin-left: 2px; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px;
  }
  .card + .card { margin-top: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  /* Tarjeta en filas apiladas: el chip ya no comparte línea con el nombre, que
     es lo que antes lo comprimía y partía "BRITHANY ELIZABETH PEREZ REYES" en
     dos líneas apretadas. Ahora el nombre dispone del ancho completo. */
  .profile {
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 10px; cursor: pointer; background: transparent;
    width: 100%; text-align: left; color: inherit; font: inherit;
    display: grid; gap: 6px; transition: border-color .15s ease;
  }
  .profile:hover { border-color: var(--accent); }
  .profile[aria-selected="true"] { border-color: var(--accent);
       box-shadow: 0 0 0 1px var(--accent) inset; }
  .profile .name {
    font-weight: 600; font-size: 14px; line-height: 1.35;
    overflow-wrap: anywhere;   /* nombres largos envuelven, no desbordan */
  }
  .profile .email {
    color: var(--muted); font-size: 12px; line-height: 1.35;
    overflow-wrap: anywhere;   /* el correo se ve entero, sin recortar */
  }
  .profile .foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-wrap: wrap; margin-top: 2px;
  }
  .profile .meta { color: var(--muted); font-size: 11.5px; }
  .profile .tag {
    font-size: 11px; padding: 1px 7px; border-radius: 5px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .chip {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid currentColor; text-transform: uppercase;
    letter-spacing: .03em; font-weight: 600;
  }
  .chip.idle, .chip.cancelled { color: var(--muted); }
  .chip.queued { color: var(--warn); }
  .chip.running { color: var(--accent); }
  .chip.success { color: var(--ok); }
  .chip.error { color: var(--err); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor;
         display: inline-block; margin-right: 5px; }
  .chip.running .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input[type=text], input[type=password], input[type=number], input[type=email] {
    width: 100%; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: inherit;
  }
  /* Campos de contraseña sin type="password": Chrome solo ofrece guardar y
     autocompletar cuando ve ese tipo, así que se oculta el texto por CSS.
     Firefox no soporta text-security; para ese caso hay un fallback en JS. */
  input.masked { -webkit-text-security: disc; text-security: disc; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0;
                  color: var(--text); font-size: 13px; }
  button {
    font: inherit; padding: 7px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
           margin-top: 4px; }
  .stat { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase;
               letter-spacing: .04em; }
  pre.console {
    background: var(--console-bg); color: var(--console-fg); border-radius: 8px;
    padding: 12px; height: 340px; overflow-y: auto; margin: 0;
    font: 12px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .empty { color: var(--muted); padding: 18px 2px; }
  .banner { border-radius: 8px; padding: 9px 12px; margin-bottom: 12px;
            border: 1px solid var(--err); color: var(--err); font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .facts { display: flex; gap: 18px; flex-wrap: wrap; margin: 12px 0 4px;
           font-size: 12px; color: var(--muted); }
  .facts b { color: var(--text); font-weight: 600; }
  .lessons { margin-top: 14px; border: 1px solid var(--border);
             border-radius: 8px; padding: 10px 12px; }
  .lessons-head { display: flex; justify-content: space-between; gap: 10px;
                  align-items: baseline; font-size: 13px; flex-wrap: wrap; }
  .lessons-head span { color: var(--muted); font-size: 12px; }
  .bar { height: 5px; border-radius: 3px; background: var(--border);
         margin: 9px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent);
           transition: width .4s ease; }
  .lessons-scroll { max-height: 190px; overflow-y: auto; overflow-x: auto; }
  .lessons table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .lessons th { text-align: left; color: var(--muted); font-weight: 500;
                padding: 4px 10px 4px 0; position: sticky; top: 0;
                background: var(--panel); }
  .lessons td { padding: 3px 10px 3px 0; }
  .lessons td.ok { color: var(--ok); }
  .lessons td.bad { color: var(--err); }
  .pending-report { margin-top: 14px; border: 1px solid var(--border);
                    border-radius: 8px; padding: 10px 12px; }
  .pending-report summary { cursor: pointer; font-weight: 600; }
  .pending-report .summary { color: var(--muted); font-size: 12px; margin: 5px 0 9px; }
  .pending-report ol { margin: 0; padding-left: 20px; max-height: 220px; overflow: auto; }
  .pending-report li { font-size: 12px; padding: 2px 0; }
  details.session { margin-top: 12px; border: 1px solid var(--border);
                    border-radius: 8px; padding: 9px 12px; }
  details.session summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  details.session table { border-collapse: collapse; margin-top: 9px; width: 100%; }
  details.session th { text-align: left; font-weight: 500; color: var(--muted);
                       padding: 3px 12px 3px 0; white-space: nowrap;
                       vertical-align: top; font-size: 12px; }
  details.session td { padding: 3px 0; font-size: 12px; word-break: break-all;
                       font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>Rosseta Stone Bot <span class="by">by elkindev</span></h1>
  <span class="chip idle" id="health">conectando…</span>
  <div class="spacer"></div>
  <input type="text" class="masked" id="token" placeholder="Token de acceso"
         style="width:190px" autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other">
</header>

<main>
  <section>
    <div class="card">
      <h2>Usuarios</h2>
      <div id="profileList"><p class="empty">Cargando…</p></div>
      <div class="actions">
        <button id="newBtn">+ Nuevo usuario</button>
      </div>
    </div>
  </section>

  <section>
    <div id="banner"></div>
    <div class="card" id="detail"><p class="empty">Selecciona o crea un usuario.</p></div>
    <div class="card">
      <h2>Registro en vivo</h2>
      <pre class="console" id="console">—</pre>
    </div>
  </section>
</main>

<script>
"use strict";

const state = { profiles: [], selected: null, cursor: 0, editing: false, autoscroll: true };
const $ = (id) => document.getElementById(id);

/* Nada de gestores de contraseñas. Esta página no es un login: guarda las
   credenciales del bot, y que Chrome ofrezca recordarlas o las autocomplete con
   otra cuenta solo estorba. Sin <form>, sin type="password" y con las marcas
   que respetan 1Password y LastPass, el diálogo no llega a dispararse. */
const NO_AUTOFILL = `autocomplete="off" autocorrect="off" autocapitalize="off"
  spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore
  data-form-type="other"`;

/* Firefox no implementa text-security: allí sí hace falta type="password"
   para que la contraseña no se vea en pantalla. */
const SUPPORTS_TEXT_SECURITY =
  window.CSS && CSS.supports && CSS.supports("-webkit-text-security", "disc");

function hardenMaskedFields(root) {
  if (SUPPORTS_TEXT_SECURITY) return;
  (root || document).querySelectorAll("input.masked").forEach((input) => {
    input.type = "password";
  });
}

$("token").value = localStorage.getItem("rosetta_token") || "";
$("token").addEventListener("change", (e) => {
  localStorage.setItem("rosetta_token", e.target.value.trim());
  refresh();
});

async function api(path, options = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers);
  const token = $("token").value.trim();
  if (token) headers["X-Auth-Token"] = token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

function showError(message) {
  $("banner").innerHTML = message ? `<div class="banner">${escapeHtml(message)}</div>` : "";
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

/* Rosetta devuelve el nombre en mayúsculas ("BRITHANY ELIZABETH PEREZ REYES").
   Gritado ocupa más y se lee peor, así que se pasa a capitalización normal.
   Un nombre que ya viene en mixto se deja como está. */
function personName(nombre) {
  const texto = String(nombre || "").trim();
  if (!texto || texto !== texto.toUpperCase()) return texto;
  return texto.toLowerCase().replace(/(^|[\s'-])(\p{L})/gu,
    (_, sep, letra) => sep + letra.toUpperCase());
}

function productLabel(product) {
  if (product === "fluency_builder") return "Fluency Builder";
  if (product === "foundations") return "Foundations";
  return product;
}

function statusLabel(profile) {
  const status = profile.run.status;
  const verifying = profile.run.mode === "verify";
  const checking = profile.run.mode === "pending";
  if (status === "queued" && profile.queue_position)
    return `en cola #${profile.queue_position}`;
  if (status === "running") return verifying ? "verificando" : checking ? "consultando" : "running";
  if (status === "success" && verifying) return "verificado";
  if (status === "success" && checking) return "actualizado";
  return status;
}

function renderPendingReport(report) {
  if (!report) return "";
  const items = (list) => list.map((item) => `<li><b>${escapeHtml(item.course)}</b> ·
    ${escapeHtml(item.lesson)} · ${escapeHtml(item.activity_id)}</li>`).join("");
  return `<div class="pending-report">
    <b>Estado real de Fluency Builder</b>
    <p class="summary">${report.completed.length} completas · ${report.pending.length} pendientes${report.recovered ? " · " + report.recovered + " agregadas a memoria" : ""}</p>
    <details><summary>Ver completas (${report.completed.length})</summary><ol>${items(report.completed)}</ol></details>
    <details><summary>Ver pendientes (${report.pending.length})</summary><ol>${items(report.pending)}</ol></details>
  </div>`;
}

/* Lo que la verificación averiguó de la cuenta. */
function renderAccountFacts(profile) {
  if (!profile.product && profile.institution_selected === null) {
    return `<p class="hint">Sin verificar todavía. Pulsa <b>Verificar</b> para
      comprobar el acceso y saber qué producto usa esta cuenta.</p>`;
  }
  const producto = profile.product
    ? (profile.product === "fluency_builder" ? "Fluency Builder" : "Foundations")
    : "sin detectar";
  const inst = profile.institution_selected === null ? "sin comprobar"
    : profile.institution_selected ? "encontrada" : "no apareció";
  const lecciones = profile.fluency_max_lessons
    ? `${profile.fluency_max_lessons} por corrida`
    : "todas las pendientes";

  return `
    <div class="facts">
      <span><b>Producto:</b> ${escapeHtml(producto)}</span>
      <span><b>Ruta institucional:</b> ${escapeHtml(inst)}</span>
      ${profile.product === "fluency_builder"
        ? `<span><b>Lecciones:</b> ${escapeHtml(lecciones)}</span>` : ""}
    </div>`;
}

function renderList() {
  const container = $("profileList");
  if (!state.profiles.length) {
    container.innerHTML = '<p class="empty">Sin usuarios todavía.</p>';
    return;
  }
  container.innerHTML = state.profiles.map((p) => `
    <button class="profile" data-id="${p.id}" aria-selected="${p.id === state.selected}">
      ${p.display_name ? `<div class="name">${escapeHtml(personName(p.display_name))}</div>` : ""}
      <div class="email">${escapeHtml(p.email)}</div>
      <div class="foot">
        <span class="chip ${p.run.status}"><i class="dot"></i>${escapeHtml(statusLabel(p))}</span>
        ${p.product ? `<span class="tag">${escapeHtml(productLabel(p.product))}</span>` : ""}
      </div>
      <div class="meta">${p.progress.total_done} completadas · hoy ${p.progress.done_today}</div>
    </button>`).join("");

  container.querySelectorAll(".profile").forEach((node) => {
    node.addEventListener("click", () => {
      if (state.selected !== node.dataset.id) {
        state.selected = node.dataset.id;
        state.cursor = 0;
        state.editing = false;
        $("console").textContent = "—";
      }
      render();
    });
  });
}

/* Avance de la corrida por unidad y lección, construido con los eventos que
   emite el worker. Aparece en cuanto llega el primer path. */
function renderLessons(run) {
  if (!run.lessons || !run.lessons.length) {
    if (run.status !== "running") return "";
    return `<p class="hint">Esperando el primer envío…</p>`;
  }

  const pct = run.paths_total
    ? Math.round(((run.paths_done + run.paths_failed) / run.paths_total) * 100)
    : null;

  // Foundations numera unidades y lecciones; Fluency las nombra y no tiene
  // unidad. Se prefija con U/L solo cuando el valor es un número.
  const etiqueta = (valor, prefijo) =>
    valor === null || valor === undefined || valor === ""
      ? "—"
      : (typeof valor === "number" ? prefijo + valor : String(valor));

  const filas = run.lessons.map((l) => `
    <tr>
      <td>${escapeHtml(l.course)}</td>
      <td>${escapeHtml(etiqueta(l.unit, "U"))}</td>
      <td>${escapeHtml(etiqueta(l.lesson, "L"))}</td>
      <td class="ok">${l.ok}</td>
      <td class="${l.failed ? "bad" : ""}">${l.failed || "—"}</td>
    </tr>`).join("");

  return `
    <div class="lessons">
      <div class="lessons-head">
        <b>Avance de esta corrida</b>
        <span>${run.paths_done} enviados${run.paths_failed ? " · " + run.paths_failed + " fallidos" : ""}${
          run.paths_total ? " de " + run.paths_total : ""}</span>
      </div>
      ${pct === null ? "" : `<div class="bar"><i style="width:${Math.min(100, pct)}%"></i></div>`}
      <div class="lessons-scroll">
        <table>
          <thead><tr><th>Curso</th><th>Unidad</th><th>Lección</th><th>OK</th><th>Fallidos</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>`;
}

/* Tokens de acceso de este usuario, capturados en su última ejecución. Los
   identificadores van en claro; el JWT y el token de sesión llegan ya
   enmascarados del servidor — el valor real solo existe en el archivo
   state/sessions/<id>.json. */
function renderSession(session) {
  if (!session || !session.captured_at) {
    return `<p class="hint">Tokens de acceso: se capturan en la primera ejecución.</p>`;
  }
  const rows = [
    ["Escuela", session.school_id],
    ["Usuario", session.user_id],
    ["Idioma", session.lang_code],
    ["Producto", session.product],
    ["Authorization", session.authorization],
    ["Token de sesión", session.session_token],
  ].filter(([, value]) => value);

  return `
    <details class="session">
      <summary>Tokens de acceso · capturados ${escapeHtml(new Date(session.captured_at).toLocaleString())}</summary>
      <table>
        ${rows.map(([label, value]) =>
          `<tr><th>${escapeHtml(label)}</th><td>${escapeHtml(value)}</td></tr>`).join("")}
      </table>
      <p class="hint">Los valores completos viven en state/sessions/ dentro de los datos del bot.</p>
    </details>`;
}

function renderDetail() {
  const detail = $("detail");
  const profile = state.profiles.find((p) => p.id === state.selected);

  if (state.editing) { renderForm(profile); return; }
  if (!profile) {
    detail.innerHTML = '<p class="empty">Selecciona o crea un usuario.</p>';
    return;
  }

  const run = profile.run;
  const busy = run.status === "running" || run.status === "queued";
  const lastRun = profile.progress.last_run
    ? new Date(profile.progress.last_run).toLocaleString()
    : "nunca";

  detail.innerHTML = `
    <h2>${escapeHtml(personName(profile.display_name) || profile.email)}</h2>
    <div class="email" style="color:var(--muted);margin-bottom:12px">
      ${escapeHtml(profile.email)}
      ${profile.product ? " · " + escapeHtml(productLabel(profile.product)) : ""}
      ${profile.has_password ? "" : " · <b>sin contraseña guardada</b>"}
    </div>
    <div class="stats">
      <div class="stat"><b>${profile.progress.total_done}</b><span>Paths totales</span></div>
      <div class="stat"><b>${profile.progress.done_today}</b><span>Hoy</span></div>
      <div class="stat"><b class="chip ${run.status}" style="font-size:13px">${escapeHtml(statusLabel(profile))}</b><span>Estado</span></div>
    </div>
    ${renderAccountFacts(profile)}
    <p class="hint">Última corrida: ${escapeHtml(lastRun)}${run.error ? " · Error: " + escapeHtml(run.error) : ""}</p>
    ${renderPendingReport(run.pending_report)}
    ${renderLessons(run)}
    ${renderSession(profile.session)}
    ${profile.has_password ? "" : `
      <label for="runPassword">Contraseña para esta corrida</label>
      <input type="text" class="masked" id="runPassword" ${NO_AUTOFILL}
             placeholder="No se guardará">`}
    <div class="actions">
      <button class="primary" id="runBtn" ${busy ? "disabled" : ""}>Ejecutar</button>
      <button id="verifyBtn" ${busy ? "disabled" : ""}>Verificar</button>
      <button id="pendingBtn" ${busy || !["fluency_builder", "foundations"].includes(profile.product) ? "disabled" : ""}>Pendiente</button>
      <button id="stopBtn" ${busy ? "" : "disabled"}>Detener</button>
      <button id="editBtn">Editar</button>
      <button class="danger" id="deleteBtn" ${busy ? "disabled" : ""}>Eliminar</button>
    </div>
    <p class="hint">Pendiente consulta el producto real, no envía respuestas y actualiza la memoria con lo que ya esté completado.</p>`;

  hardenMaskedFields(detail);

  async function launch(accion) {
    const field = $("runPassword");
    try {
      await api(`/api/profiles/${profile.id}/${accion}`, {
        method: "POST",
        body: JSON.stringify({ password: field ? field.value : null }),
      });
      state.cursor = 0;
      $("console").textContent = "";
      showError("");
      refresh({ force: true });
    } catch (err) { showError(err.message); }
  }

  $("runBtn").addEventListener("click", () => launch("run"));
  $("verifyBtn").addEventListener("click", () => launch("verify"));
  $("pendingBtn").addEventListener("click", () => launch("pending"));

  $("stopBtn").addEventListener("click", async () => {
    try { await api(`/api/profiles/${profile.id}/stop`, { method: "POST" }); showError(""); }
    catch (err) { showError(err.message); }
    refresh({ force: true });
  });

  $("editBtn").addEventListener("click", () => { state.editing = true; render(); });

  $("deleteBtn").addEventListener("click", async () => {
    if (!confirm(`¿Eliminar el usuario "${profile.name}"? Su progreso guardado no se borra.`)) return;
    try {
      await api(`/api/profiles/${profile.id}`, { method: "DELETE" });
      state.selected = null;
      showError("");
      refresh({ force: true });
    } catch (err) { showError(err.message); }
  });
}

function renderForm(profile) {
  const isNew = !profile;
  const value = profile || { email: "", has_password: false };

  $("detail").innerHTML = `
    <h2>${isNew ? "Nuevo usuario" : "Editar usuario"}</h2>
    <label for="f_email">Correo de Rosetta Stone</label>
    <input type="text" inputmode="email" id="f_email" value="${escapeHtml(value.email)}"
           ${NO_AUTOFILL}>
    <label for="f_password">Contraseña${isNew ? "" : " (vacío = sin cambios)"}</label>
    <input type="text" class="masked" id="f_password" ${NO_AUTOFILL}
           placeholder="${value.has_password ? "•••••••• guardada" : ""}">
    <div class="actions">
      <button class="primary" id="saveBtn">Guardar</button>
      <button id="cancelBtn">Cancelar</button>
    </div>
    <p class="hint">Lo demás lo averigua el bot al ejecutar: nombre de la cuenta,
      producto y el curso completo desde la propia plataforma.</p>
    <p class="hint">La contraseña se guarda en texto plano en profiles.json, igual que en el .env.</p>`;

  hardenMaskedFields($("detail"));

  $("cancelBtn").addEventListener("click", () => { state.editing = false; render(); });

  $("saveBtn").addEventListener("click", async () => {
    const body = { email: $("f_email").value.trim() };
    const password = $("f_password").value;
    if (isNew || password) body.password = password || null;

    if (!body.email) { showError("El correo es obligatorio."); return; }
    if (isNew && !password) { showError("La contraseña es obligatoria."); return; }

    try {
      const saved = isNew
        ? await api("/api/profiles", { method: "POST", body: JSON.stringify(body) })
        : await api(`/api/profiles/${profile.id}`, { method: "PATCH", body: JSON.stringify(body) });
      state.selected = saved.id;
      state.editing = false;
      state.cursor = 0;
      $("console").textContent = "";
      showError("");

      // Un usuario recién creado se verifica solo: comprueba el acceso y
      // averigua el producto antes de que nadie pulse Ejecutar.
      if (isNew) {
        try {
          await api(`/api/profiles/${saved.id}/verify`, {
            method: "POST", body: JSON.stringify({}),
          });
        } catch (err) { showError("Guardado, pero no se pudo verificar: " + err.message); }
      }
      refresh({ force: true });
    } catch (err) { showError(err.message); }
  });
}

function render() { renderList(); renderDetail(); }

/* El refresco automático no debe redibujar el panel derecho mientras lo estás
   usando: reemplazar su innerHTML borra lo que hay escrito y destruye el nodo
   del botón, así que un clic que caiga en ese instante se pierde sin llegar a
   enviarse. La lista de la izquierda sí se refresca siempre: no tiene inputs. */
function isUserBusyInDetail() {
  if (state.editing) return true;
  const active = document.activeElement;
  return Boolean(active && active.tagName === "INPUT" && $("detail").contains(active));
}

async function refresh({ force = false } = {}) {
  try {
    const data = await api("/api/profiles");
    state.profiles = data.profiles;
    $("health").textContent = "conectado";
    $("health").className = "chip success";
  } catch (err) {
    $("health").textContent = "sin conexión";
    $("health").className = "chip error";
    showError(err.message);
    return;
  }
  renderList();
  if (force || !isUserBusyInDetail()) renderDetail();
}

async function pollLogs() {
  if (!state.selected) return;
  try {
    const data = await api(`/api/profiles/${state.selected}/logs?since=${state.cursor}`);
    if (data.lines.length) {
      const box = $("console");
      if (box.textContent === "—" || box.textContent === "") box.textContent = "";
      box.textContent += data.lines.join("\n") + "\n";
      state.cursor = data.cursor;
      if (state.autoscroll) box.scrollTop = box.scrollHeight;
    }
  } catch (_) { /* el refresco general ya reporta la caída */ }
}

$("newBtn").addEventListener("click", () => {
  state.selected = null;
  state.editing = true;
  render();
});

$("console").addEventListener("scroll", (e) => {
  const box = e.target;
  state.autoscroll = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
});

hardenMaskedFields(document);
refresh();
setInterval(() => refresh(), 2500);
setInterval(pollLogs, 1000);
</script>
</body>
</html>

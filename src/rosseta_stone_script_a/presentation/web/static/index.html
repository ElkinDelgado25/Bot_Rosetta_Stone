<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosetta Script A</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --border: #e2e5ea; --text: #1b1f24;
    --muted: #6b7280; --accent: #2f6fd0; --ok: #1a7f47; --err: #c0392b;
    --warn: #b7791f; --console-bg: #12151a; --console-fg: #d6dde7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --border: #262c35; --text: #e6eaf0;
      --muted: #9aa4b2; --accent: #5b9cf5; --ok: #4ade80; --err: #f87171;
      --warn: #fbbf24; --console-bg: #0a0d11; --console-fg: #cbd5e1;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .spacer { flex: 1; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px;
  }
  .card + .card { margin-top: 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .profile {
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer; background: transparent;
    width: 100%; text-align: left; color: inherit; font: inherit;
  }
  .profile:hover { border-color: var(--accent); }
  .profile[aria-selected="true"] { border-color: var(--accent);
       box-shadow: 0 0 0 1px var(--accent) inset; }
  .profile .top { display: flex; align-items: center; gap: 8px; }
  .profile .name { font-weight: 600; }
  .profile .email, .profile .meta { color: var(--muted); font-size: 12px; }
  .chip {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid currentColor; text-transform: uppercase;
    letter-spacing: .03em; font-weight: 600;
  }
  .chip.idle, .chip.cancelled { color: var(--muted); }
  .chip.queued { color: var(--warn); }
  .chip.running { color: var(--accent); }
  .chip.success { color: var(--ok); }
  .chip.error { color: var(--err); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor;
         display: inline-block; margin-right: 5px; }
  .chip.running .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input[type=text], input[type=password], input[type=number], input[type=email] {
    width: 100%; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: inherit;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
  .checks label { display: flex; align-items: center; gap: 6px; margin: 0;
                  color: var(--text); font-size: 13px; }
  button {
    font: inherit; padding: 7px 13px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
           margin-top: 4px; }
  .stat { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase;
               letter-spacing: .04em; }
  pre.console {
    background: var(--console-bg); color: var(--console-fg); border-radius: 8px;
    padding: 12px; height: 340px; overflow-y: auto; margin: 0;
    font: 12px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .empty { color: var(--muted); padding: 18px 2px; }
  .banner { border-radius: 8px; padding: 9px 12px; margin-bottom: 12px;
            border: 1px solid var(--err); color: var(--err); font-size: 13px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Rosetta Script A</h1>
  <span class="chip idle" id="health">conectando…</span>
  <div class="spacer"></div>
  <input type="password" id="token" placeholder="Token de acceso" style="width:190px">
</header>

<main>
  <section>
    <div class="card">
      <h2>Usuarios</h2>
      <div id="profileList"><p class="empty">Cargando…</p></div>
      <div class="actions">
        <button id="newBtn">+ Nuevo usuario</button>
      </div>
    </div>
  </section>

  <section>
    <div id="banner"></div>
    <div class="card" id="detail"><p class="empty">Selecciona o crea un usuario.</p></div>
    <div class="card">
      <h2>Registro en vivo</h2>
      <pre class="console" id="console">—</pre>
    </div>
  </section>
</main>

<script>
"use strict";

const state = { profiles: [], selected: null, cursor: 0, editing: false, autoscroll: true };
const $ = (id) => document.getElementById(id);

$("token").value = localStorage.getItem("rosetta_token") || "";
$("token").addEventListener("change", (e) => {
  localStorage.setItem("rosetta_token", e.target.value.trim());
  refresh();
});

async function api(path, options = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, options.headers);
  const token = $("token").value.trim();
  if (token) headers["X-Auth-Token"] = token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

function showError(message) {
  $("banner").innerHTML = message ? `<div class="banner">${escapeHtml(message)}</div>` : "";
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function statusLabel(profile) {
  const status = profile.run.status;
  if (status === "queued" && profile.queue_position)
    return `en cola #${profile.queue_position}`;
  return status;
}

function renderList() {
  const container = $("profileList");
  if (!state.profiles.length) {
    container.innerHTML = '<p class="empty">Sin usuarios todavía.</p>';
    return;
  }
  container.innerHTML = state.profiles.map((p) => `
    <button class="profile" data-id="${p.id}" aria-selected="${p.id === state.selected}">
      <span class="top">
        <span class="name">${escapeHtml(p.name)}</span>
        <span class="chip ${p.run.status}"><i class="dot"></i>${escapeHtml(statusLabel(p))}</span>
      </span>
      <div class="email">${escapeHtml(p.email)}</div>
      <div class="meta">${p.progress.total_done} completados · hoy ${p.progress.done_today}</div>
    </button>`).join("");

  container.querySelectorAll(".profile").forEach((node) => {
    node.addEventListener("click", () => {
      if (state.selected !== node.dataset.id) {
        state.selected = node.dataset.id;
        state.cursor = 0;
        state.editing = false;
        $("console").textContent = "—";
      }
      render();
    });
  });
}

function renderDetail() {
  const detail = $("detail");
  const profile = state.profiles.find((p) => p.id === state.selected);

  if (state.editing) { renderForm(profile); return; }
  if (!profile) {
    detail.innerHTML = '<p class="empty">Selecciona o crea un usuario.</p>';
    return;
  }

  const run = profile.run;
  const busy = run.status === "running" || run.status === "queued";
  const lastRun = profile.progress.last_run
    ? new Date(profile.progress.last_run).toLocaleString()
    : "nunca";

  detail.innerHTML = `
    <h2>${escapeHtml(profile.name)}</h2>
    <div class="email" style="color:var(--muted);margin-bottom:12px">
      ${escapeHtml(profile.email)}
      ${profile.has_password ? "" : " · <b>sin contraseña guardada</b>"}
    </div>
    <div class="stats">
      <div class="stat"><b>${profile.progress.total_done}</b><span>Paths totales</span></div>
      <div class="stat"><b>${profile.progress.done_today}</b><span>Hoy</span></div>
      <div class="stat"><b class="chip ${run.status}" style="font-size:13px">${escapeHtml(statusLabel(profile))}</b><span>Estado</span></div>
    </div>
    <p class="hint">Última corrida: ${escapeHtml(lastRun)}${run.error ? " · Error: " + escapeHtml(run.error) : ""}</p>
    ${profile.has_password ? "" : `
      <label for="runPassword">Contraseña para esta corrida</label>
      <input type="password" id="runPassword" placeholder="No se guardará">`}
    <div class="actions">
      <button class="primary" id="runBtn" ${busy ? "disabled" : ""}>Ejecutar</button>
      <button id="stopBtn" ${busy ? "" : "disabled"}>Detener</button>
      <button id="editBtn">Editar</button>
      <button class="danger" id="deleteBtn" ${busy ? "disabled" : ""}>Eliminar</button>
    </div>`;

  $("runBtn").addEventListener("click", async () => {
    const field = $("runPassword");
    try {
      await api(`/api/profiles/${profile.id}/run`, {
        method: "POST",
        body: JSON.stringify({ password: field ? field.value : null }),
      });
      state.cursor = 0;
      $("console").textContent = "";
      showError("");
      refresh();
    } catch (err) { showError(err.message); }
  });

  $("stopBtn").addEventListener("click", async () => {
    try { await api(`/api/profiles/${profile.id}/stop`, { method: "POST" }); showError(""); }
    catch (err) { showError(err.message); }
    refresh();
  });

  $("editBtn").addEventListener("click", () => { state.editing = true; render(); });

  $("deleteBtn").addEventListener("click", async () => {
    if (!confirm(`¿Eliminar el usuario "${profile.name}"? Su progreso guardado no se borra.`)) return;
    try {
      await api(`/api/profiles/${profile.id}`, { method: "DELETE" });
      state.selected = null;
      showError("");
      refresh();
    } catch (err) { showError(err.message); }
  });
}

function renderForm(profile) {
  const isNew = !profile;
  const value = profile || {
    name: "", email: "", units_to_complete: [], lessons_to_complete: [],
    path_types_to_complete: [], target_score_percent: 100, human_mode: false,
    force_recomplete: false, max_paths_per_day: 18, has_password: false,
  };

  $("detail").innerHTML = `
    <h2>${isNew ? "Nuevo usuario" : "Editar usuario"}</h2>
    <div class="row">
      <div><label for="f_name">Nombre</label>
        <input type="text" id="f_name" value="${escapeHtml(value.name)}"></div>
      <div><label for="f_email">Email de Rosetta Stone</label>
        <input type="email" id="f_email" value="${escapeHtml(value.email)}"></div>
    </div>
    <label for="f_password">Contraseña ${isNew ? "" : "(vacío = sin cambios)"}</label>
    <input type="password" id="f_password" placeholder="${value.has_password ? "•••••••• guardada" : "sin guardar"}">
    <div class="row">
      <div><label for="f_units">Unidades (vacío = todas)</label>
        <input type="text" id="f_units" value="${value.units_to_complete.join(",")}" placeholder="1,2,3"></div>
      <div><label for="f_lessons">Lecciones (vacío = todas)</label>
        <input type="text" id="f_lessons" value="${value.lessons_to_complete.join(",")}" placeholder="1,2"></div>
    </div>
    <div class="row">
      <div><label for="f_types">Tipos de path (vacío = todos)</label>
        <input type="text" id="f_types" value="${value.path_types_to_complete.join(",")}" placeholder="production_milestone"></div>
      <div><label for="f_score">Puntaje objetivo %</label>
        <input type="number" id="f_score" min="0" max="100" value="${value.target_score_percent}"></div>
    </div>
    <label for="f_cap">Tope diario de paths (solo en modo humano)</label>
    <input type="number" id="f_cap" min="1" max="500" value="${value.max_paths_per_day}">
    <div class="checks">
      <label><input type="checkbox" id="f_human" ${value.human_mode ? "checked" : ""}> Modo humano</label>
      <label><input type="checkbox" id="f_force" ${value.force_recomplete ? "checked" : ""}> Recompletar</label>
    </div>
    <div class="actions">
      <button class="primary" id="saveBtn">Guardar</button>
      <button id="cancelBtn">Cancelar</button>
    </div>
    <p class="hint">La contraseña se guarda en texto plano en profiles.json, igual que en el .env.
      Déjala vacía para que se pida en cada ejecución.</p>`;

  $("cancelBtn").addEventListener("click", () => { state.editing = false; render(); });

  $("saveBtn").addEventListener("click", async () => {
    const numbers = (id) => $(id).value.split(",").map((s) => s.trim())
      .filter(Boolean).map(Number).filter((n) => Number.isInteger(n));
    const body = {
      name: $("f_name").value.trim(),
      email: $("f_email").value.trim(),
      units_to_complete: numbers("f_units"),
      lessons_to_complete: numbers("f_lessons"),
      path_types_to_complete: $("f_types").value.split(",").map((s) => s.trim()).filter(Boolean),
      target_score_percent: Number($("f_score").value),
      max_paths_per_day: Number($("f_cap").value),
      human_mode: $("f_human").checked,
      force_recomplete: $("f_force").checked,
    };
    const password = $("f_password").value;
    if (isNew || password) body.password = password || null;
    if (!body.name || !body.email) { showError("Nombre y email son obligatorios."); return; }

    try {
      const saved = isNew
        ? await api("/api/profiles", { method: "POST", body: JSON.stringify(body) })
        : await api(`/api/profiles/${profile.id}`, { method: "PATCH", body: JSON.stringify(body) });
      state.selected = saved.id;
      state.editing = false;
      showError("");
      refresh();
    } catch (err) { showError(err.message); }
  });
}

function render() { renderList(); renderDetail(); }

async function refresh() {
  try {
    const data = await api("/api/profiles");
    state.profiles = data.profiles;
    $("health").textContent = "conectado";
    $("health").className = "chip success";
    showError("");
  } catch (err) {
    $("health").textContent = "sin conexión";
    $("health").className = "chip error";
    showError(err.message);
    return;
  }
  render();
}

async function pollLogs() {
  if (!state.selected) return;
  try {
    const data = await api(`/api/profiles/${state.selected}/logs?since=${state.cursor}`);
    if (data.lines.length) {
      const box = $("console");
      if (box.textContent === "—" || box.textContent === "") box.textContent = "";
      box.textContent += data.lines.join("\n") + "\n";
      state.cursor = data.cursor;
      if (state.autoscroll) box.scrollTop = box.scrollHeight;
    }
  } catch (_) { /* el refresco general ya reporta la caída */ }
}

$("newBtn").addEventListener("click", () => {
  state.selected = null;
  state.editing = true;
  render();
});

$("console").addEventListener("scroll", (e) => {
  const box = e.target;
  state.autoscroll = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
});

refresh();
setInterval(refresh, 2500);
setInterval(pollLogs, 1000);
</script>
</body>
</html>
